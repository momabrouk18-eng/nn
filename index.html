```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Just For You</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Parisienne&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    #8f263f 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    #5d162d 0%,
                    transparent 35%
                ),
                linear-gradient(
                    145deg,
                    #210711,
                    #3a0b1b 45%,
                    #18050d
                );

            color: #fff4f5;

            font-family:
                "Cormorant Garamond",
                serif;
        }

        /* Background glow */

        .background-glow {
            position: fixed;

            width: 500px;
            height: 500px;

            border-radius: 50%;

            background:
                rgba(255, 105, 145, 0.08);

            filter: blur(80px);

            animation:
                breathe 5s ease-in-out infinite;

            pointer-events: none;
        }

        @keyframes breathe {
            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.15);
                opacity: 1;
            }
        }

        /* Floating particles */

        .particles {
            position: fixed;

            inset: 0;

            pointer-events: none;

            overflow: hidden;
        }

        .particle {
            position: absolute;

            bottom: -30px;

            opacity: 0;

            animation:
                floatUp linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform:
                    translateY(0)
                    scale(0.8)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.7;
            }

            80% {
                opacity: 0.7;
            }

            100% {
                transform:
                    translateY(-115vh)
                    scale(1.2)
                    rotate(25deg);

                opacity: 0;
            }
        }

        /* Main content */

        .container {
            position: relative;

            z-index: 5;

            width: min(90%, 430px);

            text-align: center;

            transition:
                transform 0.8s ease,
                opacity 0.8s ease;
        }

        .small-title {
            margin: 0 0 8px;

            font-size: 17px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: #f8b9c8;

            opacity: 0.85;
        }

        .main-title {
            margin: 0;

            font-family:
                "Parisienne",
                cursive;

            font-size:
                clamp(48px, 13vw, 68px);

            font-weight: 400;

            color: #fff7f8;

            text-shadow:
                0 0 20px
                rgba(255, 145, 170, 0.35);
        }

        .subtitle {
            margin:
                8px 0 34px;

            font-size: 18px;

            color: #f6dce2;

            opacity: 0.8;
        }

        /* Heart */

        .heart-wrapper {
            position: relative;

            width: 150px;
            height: 150px;

            margin: 0 auto;

            cursor: pointer;

            transition:
                transform 0.35s ease,
                opacity 0.6s ease;
        }

        .heart-wrapper:hover {
            transform: scale(1.06);
        }

        .heart-wrapper:active {
            transform: scale(0.94);
        }

        .heart-glow {
            position: absolute;

            inset: 15px;

            border-radius: 50%;

            background:
                rgba(255, 91, 130, 0.25);

            filter: blur(25px);

            animation:
                heartGlow 2s ease-in-out infinite;
        }

        @keyframes heartGlow {
            0%,
            100% {
                transform: scale(0.9);
                opacity: 0.5;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }

        .heart {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 88px;
            height: 88px;

            transform:
                translate(-50%, -46%)
                rotate(-45deg);

            background:
                linear-gradient(
                    135deg,
                    #ff8fa8,
                    #e83f68
                );

            border-radius: 14px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.35),

                inset 0 2px 10px
                rgba(255, 255, 255, 0.25);

            animation:
                heartbeat 1.8s ease-in-out infinite;
        }

        .heart::before,
        .heart::after {
            content: "";

            position: absolute;

            width: 88px;
            height: 88px;

            background: inherit;

            border-radius: 50%;
        }

        .heart::before {
            top: -44px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 44px;
        }

        @keyframes heartbeat {
            0%,
            100% {
                transform:
                    translate(-50%, -46%)
                    rotate(-45deg)
                    scale(1);
            }

            15% {
                transform:
                    translate(-50%, -46%)
                    rotate(-45deg)
                    scale(1.08);
            }

            30% {
                transform:
                    translate(-50%, -46%)
                    rotate(-45deg)
                    scale(1);
            }

            45% {
                transform:
                    translate(-50%, -46%)
                    rotate(-45deg)
                    scale(1.05);
            }
        }

        .heart-icon {
            position: absolute;

            z-index: 3;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            font-size: 32px;

            pointer-events: none;
        }

        .tap-text {
            margin-top: 25px;

            font-size: 16px;

            letter-spacing: 1px;

            color: #f5cbd4;

            animation:
                softPulse 2s ease-in-out infinite;
        }

        @keyframes softPulse {
            0%,
            100% {
                opacity: 0.5;
            }

            50% {
                opacity: 1;
            }
        }

        /* Hide intro */

        .container.hide {
            opacity: 0;

            transform: scale(0.85);

            pointer-events: none;
        }

        /* Message */

        .message {
            position: absolute;

            left: 50%;
            top: 50%;

            width: min(90vw, 430px);

            transform:
                translate(-50%, -42%)
                scale(0.7);

            opacity: 0;

            pointer-events: none;

            transition:
                opacity 1s ease,
                transform 1s
                cubic-bezier(.22, 1, .36, 1);
        }

        .message.show {
            transform:
                translate(-50%, -50%)
                scale(1);

            opacity: 1;

            pointer-events: auto;
        }

        .message-card {
            position: relative;

            padding:
                42px 28px 38px;

            border:
                1px solid
                rgba(255, 190, 205, 0.22);

            border-radius: 28px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, 0.10),
                    rgba(255, 255, 255, 0.035)
                );

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.4),

                inset 0 1px 0
                rgba(255, 255, 255, 0.1);
        }

        .message-card::before {
            content: "♡";

            position: absolute;

            top: -22px;
            left: 50%;

            transform:
                translateX(-50%);

            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                #e95073;

            color: white;

            font-size: 24px;

            box-shadow:
                0 8px 25px
                rgba(233, 80, 115, 0.4);
        }

        .message-label {
            margin:
                0 0 18px;

            font-size: 14px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: #f3aabb;
        }

        .message-en {
            margin: 0;

            font-family:
                "Parisienne",
                cursive;

            font-size:
                clamp(32px, 9vw, 46px);

            line-height: 1.2;

            color: #fff8fa;
        }

        .divider {
            width: 50px;
            height: 1px;

            margin:
                25px auto;

            background:
                rgba(255, 190, 205, 0.6);
        }

        .message-zh {
            margin: 0;

            font-family:
                "Cormorant Garamond",
                serif;

            font-size: 23px;

            line-height: 1.7;

            font-weight: 600;

            color: #ffe8ed;
        }

        /* Burst */

        .burst {
            position: fixed;

            left: 50%;
            top: 50%;

            z-index: 20;

            pointer-events: none;
        }

        .burst-item {
            position: absolute;

            left: 0;
            top: 0;

            font-size: 22px;

            animation:
                burst 1.2s
                cubic-bezier(.1, .8, .2, 1)
                forwards;
        }

        @keyframes burst {
            0% {
                transform:
                    translate(-50%, -50%)
                    scale(0.3);

                opacity: 1;
            }

            100% {
                transform:
                    translate(
                        calc(-50% + var(--x)),
                        calc(-50% + var(--y))
                    )
                    scale(1.1)
                    rotate(var(--r));

                opacity: 0;
            }
        }

        /* Mobile */

        @media (max-width: 500px) {

            body {
                padding: 20px;
            }

            .message-card {
                padding:
                    38px 22px 32px;
            }

            .message-zh {
                font-size: 21px;
            }

            .subtitle {
                margin-bottom: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="background-glow"></div>

    <div
        class="particles"
        id="particles">
    </div>

    <div
        class="container"
        id="intro">

        <div class="small-title">
            A little surprise
        </div>

        <h1 class="main-title">
            Just for you
        </h1>

        <p class="subtitle">
            I have something to tell you...
        </p>

        <div
            class="heart-wrapper"
            onclick="revealMessage()">

            <div class="heart-glow"></div>

            <div class="heart"></div>

            <div class="heart-icon">
                ♡
            </div>

        </div>

        <div class="tap-text">
            tap the heart
        </div>

    </div>


    <div
        class="message"
        id="message">

        <div class="message-card">

            <p class="message-label">
                For the one who never fades
            </p>

            <p class="message-en">
                In a world full of roses,
                you're the one that never fades.
            </p>

            <div class="divider"></div>

            <p class="message-zh">
                在满是玫瑰的世界里，你是那朵永不凋谢的花。
            </p>

        </div>

    </div>


    <div
        class="burst"
        id="burst">
    </div>


    <script>

        /* Floating particles */

        const particles =
            document.getElementById("particles");

        const symbols = [
            "♡",
            "✦",
            "✧",
            "🌸",
            "·"
        ];

        function createParticle() {

            const particle =
                document.createElement("div");

            particle.className =
                "particle";

            particle.textContent =
                symbols[
                    Math.floor(
                        Math.random()
                        * symbols.length
                    )
                ];
```
